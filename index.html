<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinny Tracker</title>
    <meta name="description" content="Vinny Tracker">
    <meta name="author" content="Vincent">
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Vinny Tracker">
    <meta property="og:type" content="website">
    <meta property="og:description" content="A simple HTML5 boilerplate template.">
    <meta property="og:image" content="image.png">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    </header>
    <main>
        <div id="container">
            <p id="title">Vincent's Tasks — Updates every second</p>
            <p id="status">SERVER STATUS: OFFLINE</p>
            <div id="reports">   
                <p id="task-label">Current Task: </p>
                <p id="curr-task">None</p>
            </div>
        </div>
    </main>
    <footer>
    </footer>
    <!-- JavaScript -->
    <script>
        const ws = new WebSocket('https://omission-scrap-crushing.ngrok-free.dev')
        const task = document.getElementById('task')
        const status = document.getElementById('status')

        ws.onopen = () => {
            status.textContent = "SERVER STATUS: ONLINE"
        }

        ws.onclose = () => {
            status.textContent = "SERVER STATUS: OFFLINE"
        }

        ws.onerror = () => {
            status.textContent = "SERVER STATUS: ERROR"
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data)
            console.log(data.window, data.date, data.time)
            
            task.textContent = `${data.window} - ${data.date} - ${data.time}`

        }

    </script>
</body>

</html>
